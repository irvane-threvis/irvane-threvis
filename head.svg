<svg xmlns="http://www.w3.org/2000/svg" width="800" height="300" viewBox="0 0 800 300">
  <style>
    .dim { stroke-dasharray: 360; stroke-dashoffset: 360; animation: dimDraw 12s ease-out infinite; }
    .live { animation: livePulse 12s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .glow { animation: glowPulse 4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }

    @keyframes dimDraw {
      0% { stroke-dashoffset: 360; }
      28%, 88% { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: 360; }
    }
    @keyframes livePulse {
      0%, 60%, 100% { opacity: 0.85; }
      70% { opacity: 0.25; }
    }
    @keyframes glowPulse {
      0%, 100% { opacity: 0.5; }
      50% { opacity: 1; }
    }
  </style>
  <defs>
    <linearGradient id="bp-paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1035"/>
      <stop offset="45%" stop-color="#2b1657"/>
      <stop offset="100%" stop-color="#0e2f6e"/>
    </linearGradient>
    <linearGradient id="accent-line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <pattern id="bp-grid" x="24" y="24" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#a78bfa" stroke-width="0.5" stroke-opacity="0.18"/>
    </pattern>
    <pattern id="bp-grid-major" x="24" y="24" width="100" height="100" patternUnits="userSpaceOnUse">
      <path d="M 100 0 L 0 0 0 100" fill="none" stroke="#67e8f9" stroke-width="0.75" stroke-opacity="0.28"/>
    </pattern>
    <radialGradient id="glow-spot" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="100%" height="100%" fill="url(#bp-paper)" rx="4" ry="4"/>

  <circle class="glow" cx="120" cy="60" r="90" fill="url(#glow-spot)"/>
  <circle class="glow" cx="700" cy="250" r="110" fill="url(#glow-spot)"/>

  <rect x="24" y="24" width="752" height="252" fill="url(#bp-grid)"/>
  <rect x="24" y="24" width="752" height="252" fill="url(#bp-grid-major)"/>

  <rect x="24" y="24" width="752" height="252" fill="none" stroke="url(#accent-line)" stroke-width="1.25" stroke-opacity="0.8"/>
  <g>
    <line x1="19" y1="24" x2="29" y2="24" stroke="#67e8f9" stroke-width="1"/>
    <line x1="24" y1="19" x2="24" y2="29" stroke="#67e8f9" stroke-width="1"/>
  </g>
  <g>
    <line x1="771" y1="24" x2="781" y2="24" stroke="#67e8f9" stroke-width="1"/>
    <line x1="776" y1="19" x2="776" y2="29" stroke="#67e8f9" stroke-width="1"/>
  </g>
  <g>
    <line x1="19" y1="276" x2="29" y2="276" stroke="#67e8f9" stroke-width="1"/>
    <line x1="24" y1="271" x2="24" y2="281" stroke="#67e8f9" stroke-width="1"/>
  </g>
  <g>
    <line x1="771" y1="276" x2="781" y2="276" stroke="#67e8f9" stroke-width="1"/>
    <line x1="776" y1="271" x2="776" y2="281" stroke="#67e8f9" stroke-width="1"/>
  </g>

  <text x="36" y="40" fill="#a78bfa" font-family="ui-monospace, monospace" font-size="10" letter-spacing="2">FIG. 01    PROFILE</text>
  <g transform="translate(764 36)">
    <text text-anchor="end" fill="#a78bfa" font-family="ui-monospace, monospace" font-size="10" letter-spacing="2">SHEET 01 / 01</text>
    <circle class="live" cx="6" cy="-3" r="2" fill="#67e8f9" opacity="0.85"/>
  </g>
  <line x1="32" y1="48" x2="768" y2="48" stroke="url(#accent-line)" stroke-width="0.75" stroke-opacity="0.5"/>

  <g class="dim">
    <line x1="94" y1="90" x2="94" y2="114" stroke="#67e8f9" stroke-width="1"/>
    <line x1="706" y1="90" x2="706" y2="114" stroke="#67e8f9" stroke-width="1"/>
    <line x1="82" y1="84" x2="718" y2="84" stroke="#67e8f9" stroke-width="1"/>
  </g>
  <path d="M 78 84 l 5 -3 l 0 6 Z" fill="#67e8f9"/>
  <path d="M 722 84 l -5 -3 l 0 6 Z" fill="#67e8f9"/>
  <rect x="352" y="76" width="96" height="16" fill="#1a1035"/>
  <text x="400" y="88" text-anchor="middle" fill="#67e8f9" font-family="ui-monospace, monospace" font-size="11" letter-spacing="1.5">FULLSTACK developer</text>

  <text x="400" y="152" text-anchor="middle" fill="#f5f3ff" font-family='"Inter", system-ui, sans-serif' font-size="30" font-weight="800" letter-spacing="3">TOUGOUMA IRVANE THREVIS</text>
  <line x1="78" y1="158" x2="722" y2="158" stroke="url(#accent-line)" stroke-width="1.25" stroke-opacity="0.9"/>

  <g>
      <circle cx="185" cy="196" r="9" fill="none" stroke="#67e8f9" stroke-width="1.25"/>
      <text x="185" y="199" text-anchor="middle" fill="#67e8f9" font-family="ui-monospace, monospace" font-size="10" font-weight="700">1</text>
      <text x="202" y="200" fill="#f5f3ff" font-family="ui-monospace, monospace" font-size="12" letter-spacing="1">SOFTWARE ENGINEER</text>
    </g>
  <g>
      <circle cx="400" cy="196" r="9" fill="none" stroke="#67e8f9" stroke-width="1.25"/>
      <text x="400" y="199" text-anchor="middle" fill="#67e8f9" font-family="ui-monospace, monospace" font-size="10" font-weight="700">2</text>
      <text x="417" y="200" fill="#f5f3ff" font-family="ui-monospace, monospace" font-size="12" letter-spacing="1">AI EXPLORER</text>
    </g>
  <g>
      <circle cx="583" cy="196" r="9" fill="none" stroke="#67e8f9" stroke-width="1.25"/>
      <text x="583" y="199" text-anchor="middle" fill="#67e8f9" font-family="ui-monospace, monospace" font-size="10" font-weight="700">3</text>
      <text x="600" y="200" fill="#f5f3ff" font-family="ui-monospace, monospace" font-size="12" letter-spacing="1">DEVOPS</text>
    </g>

