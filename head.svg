    <text x="182" y="248" fill="#a78bfa" font-family="ui-monospace, monospace" font-size="8" letter-spacing="1.2">DATE</text>
    <text x="182" y="268" fill="#f5f3ff" font-family="ui-monospace, monospace" font-size="11" letter-spacing="1">08.26</text>
  </g>
  <g>
    <rect x="324" y="236" width="150" height="40" fill="none" stroke="#a78bfa" stroke-width="1" stroke-opacity="0.55"/>
    <text x="332" y="248" fill="#a78bfa" font-family="ui-monospace, monospace" font-size="8" letter-spacing="1.2">SCALE</text>
    <text x="332" y="268" fill="#f5f3ff" font-family="ui-monospace, monospace" font-size="11" letter-spacing="1">1:1</text>
  </g>
  <g>
    <rect x="474" y="236" width="150" height="40" fill="none" stroke="#a78bfa" stroke-width="1" stroke-opacity="0.55"/>
    <text x="482" y="248" fill="#a78bfa" font-family="ui-monospace, monospace" font-size="8" letter-spacing="1.2">REV</text>
    <text x="482" y="268" fill="#f5f3ff" font-family="ui-monospace, monospace" font-size="11" letter-spacing="1">1.0</text>
  </g>
  <g>
    <rect x="624" y="236" width="152" height="40" fill="none" stroke="#a78bfa" stroke-width="1" stroke-opacity="0.55"/>
    <text x="632" y="248" fill="#a78bfa" font-family="ui-monospace, monospace" font-size="8" letter-spacing="1.2">SHEET</text>
    <text x="632" y="268" fill="#f5f3ff" font-family="ui-monospace, monospace" font-size="11" letter-spacing="1">01 / 01</text>
  </g>
</svg>
